name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Run media regression tests
        run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend


  deploy:
    name: Deploy tingjian over SSH
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: tingjian-production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: tingjian-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify deployment configuration exists
        env:
          SSH_HOST: ${{ secrets.TINGJIAN_SSH_HOST }}
          SSH_USER: ${{ secrets.TINGJIAN_SSH_USER }}
          SSH_PORT: ${{ vars.TINGJIAN_SSH_PORT }}
          SSH_KEY: ${{ secrets.TINGJIAN_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TINGJIAN_SSH_KNOWN_HOSTS }}
          TAILSCALE_CLIENT_ID: ${{ vars.TINGJIAN_TAILSCALE_CLIENT_ID }}
          TAILSCALE_AUDIENCE: ${{ vars.TINGJIAN_TAILSCALE_AUDIENCE }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS TAILSCALE_CLIENT_ID TAILSCALE_AUDIENCE; do
            [[ -n "${!name}" ]] || { echo "::error::Missing required deployment setting: $name"; exit 1; }
          done
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]] || { echo "::error::Invalid SSH host"; exit 1; }
          [[ "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]*[$]?$ ]] || { echo "::error::Invalid SSH user"; exit 1; }
          port="${SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]{1,5}$ ]] && (( port >= 1 && port <= 65535 )) || { echo "::error::Invalid SSH port"; exit 1; }

      - name: Connect to the deployment tailnet
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
        with:
          oauth-client-id: ${{ vars.TINGJIAN_TAILSCALE_CLIENT_ID }}
          audience: ${{ vars.TINGJIAN_TAILSCALE_AUDIENCE }}
          tags: tag:tingjian-ci
          version: 1.104.2

      - name: Verify SSH access and deployment command
        env:
          SSH_HOST: ${{ secrets.TINGJIAN_SSH_HOST }}
          SSH_USER: ${{ secrets.TINGJIAN_SSH_USER }}
          SSH_PORT: ${{ vars.TINGJIAN_SSH_PORT }}
          SSH_KEY: ${{ secrets.TINGJIAN_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TINGJIAN_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_tingjian"
          chmod 600 "$HOME/.ssh/id_tingjian"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -F /dev/null -i "$HOME/.ssh/id_tingjian" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=4 \
            -p "$port" -- "$SSH_USER@$SSH_HOST" check
      - name: Deploy exact main commit source over the restricted SSH command
        env:
          SSH_HOST: ${{ secrets.TINGJIAN_SSH_HOST }}
          SSH_USER: ${{ secrets.TINGJIAN_SSH_USER }}
          SSH_PORT: ${{ vars.TINGJIAN_SSH_PORT }}
          SSH_KEY: ${{ secrets.TINGJIAN_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TINGJIAN_SSH_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Invalid deployment SHA"; exit 1; }
          port="${SSH_PORT:-22}"
          [[ "$port" =~ ^[0-9]{1,5}$ ]] && (( port >= 1 && port <= 65535 )) || { echo "Invalid SSH port"; exit 1; }
          latest_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ -n "$latest_main" ]] || { echo "::error::Could not read the current main SHA"; exit 1; }
          if [[ "$DEPLOY_SHA" != "$latest_main" ]]; then
            echo "Skipping superseded deployment $DEPLOY_SHA; main is now $latest_main"
            exit 0
          fi
          git archive --format=tar "$DEPLOY_SHA" | gzip -1 | ssh -T -F /dev/null -i "$HOME/.ssh/id_tingjian" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=4 \
            -p "$port" -- "$SSH_USER@$SSH_HOST" "deploy $DEPLOY_SHA"
