# Existing installations can run this separately on the application's network.
# No host port or app/data volume is exposed to this provider.
services:
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2@sha256:d7d34108b76e52c7d3b575fe9e797e4bf41c1b2a08f80c5292eff6f851ce8472
    restart: unless-stopped
    expose: ["4416"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    logging:
      options:
        max-size: "10m"
        max-file: "2"
    networks: [app]
networks:
  app:
    external: true
    name: ${TINGJIAN_NETWORK:-tingjian_default}
